services:
  boxing-news-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boxing-news-app
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3002
      - ORIGIN=http://localhost:3002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
